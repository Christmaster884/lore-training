<!DOCTYPE html>
<meta charset="UTF-8">
<title>Lore Training</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<!-- ===== PWA: instalable en pantalla de inicio, se ve como app (sin barra del navegador) ===== -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8547C">
<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS / Safari (Apple no lee manifest.json para el ícono/modo standalone) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lore Training">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS (light, pastel, feminine palette) ============ */
:root{
  --bg:#FFFBFD; --bg-alt:#FBF1F7; --surface:#FFFFFF; --surface-2:#FDF0F6; --surface-3:#F6E9F5;
  --border:#F3D9E8; --border-soft:#F7E4F0;
  --text:#3E2E42; --text-dim:#7C6680; --text-faint:#AE9AB2;
  --accent:#E8547C; --accent-dim:#C43F63; --accent-soft:#FCE3EC; --accent-ink:#FFFFFF;
  --sky:#4FA8D8; --sky-soft:#E4F4FB; --sky-ink:#154C68;
  --lilac:#9B7FD4; --lilac-soft:#F0EAFB; --lilac-ink:#3A2E63;
  --danger:#E15B4D; --danger-soft:#FCEAE7; --danger-ink:#8A3226;
  --success:#5FAE72; --success-soft:#E9F6EC;
  --shadow: 0 10px 30px -12px rgba(140,70,110,.18);
  --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  --font-display:'Quicksand',"Arial Rounded MT",sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,sans-serif;
  --font-mono:'Roboto Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html{color-scheme:light;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance; letter-spacing:.2px;}
p{margin:0;}
button{font-family:inherit; -webkit-tap-highlight-color:transparent;}
::selection{background:var(--accent); color:#fff;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ============ APP SHELL ============ */
#app-shell{
  max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; background:var(--bg);
  position:relative; border-inline:1px solid var(--border-soft);
}
#topbar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 18px calc(12px + env(safe-area-inset-top,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg, var(--bg-alt), var(--bg));
  border-bottom:1px solid var(--border-soft); position:sticky; top:0; z-index:20;
}
.brand{display:flex; align-items:center; gap:9px;}
.brand-badge{
  width:34px; height:34px; border-radius:11px; background:linear-gradient(150deg,var(--accent-soft),var(--lilac-soft)); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
}
.brand-text{display:flex; flex-direction:column; line-height:1.05; min-width:0;}
.brand-title{font-family:var(--font-display); font-size:.82rem; font-weight:700; letter-spacing:.2px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand-tab{font-size:.68rem; color:var(--text-faint); font-family:var(--font-body); letter-spacing:.3px; margin-top:2px;}
.streak-chip{
  display:flex; align-items:center; gap:5px; background:var(--accent-soft); color:var(--accent-dim);
  border:1px solid #F5C4D5; padding:6px 10px; border-radius:999px; font-family:var(--font-mono);
  font-size:.8rem; font-weight:600; font-variant-numeric:tabular-nums; flex-shrink:0;
}

#screen{flex:1; padding:16px 16px calc(28px); display:flex; flex-direction:column; gap:14px; min-height:0;}

nav#bottomnav{
  position:sticky; bottom:0; z-index:20; display:flex; background:var(--bg-alt);
  border-top:1px solid var(--border-soft); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
}
nav#bottomnav button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none;
  color:var(--text-faint); padding:7px 2px 5px; border-radius:12px; font-size:.63rem; font-weight:500;
  font-family:var(--font-body); letter-spacing:.2px; cursor:pointer;
}
nav#bottomnav button .nav-ic{font-size:1.28rem; line-height:1;}
nav#bottomnav button.active{color:var(--accent-dim);}
nav#bottomnav button.active .nav-ic{transform:translateY(-1px);}

/* ============ PRIMITIVES ============ */
.card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
  padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:0 1px 0 rgba(140,70,110,.03);
}
.card.tight{padding:13px 15px; gap:6px;}
.card-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.eyebrow{font-size:.68rem; text-transform:uppercase; letter-spacing:1.4px; color:var(--text-faint); font-weight:700;}
.section-title{font-size:1.15rem;}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);}
.big-num{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-weight:600;}

.btn{
  border:none; border-radius:var(--radius-md); font-family:var(--font-body); font-weight:800;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 18px; font-size:.95rem; letter-spacing:.2px; transition:transform .08s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent); color:#fff; box-shadow:0 6px 16px -6px rgba(232,84,124,.55);}
.btn-primary:disabled{opacity:.5;}
.btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn-teal{background:var(--sky); color:#fff;}
.btn-danger{background:var(--danger); color:#fff;}
.btn-danger-outline{background:var(--danger-soft); color:var(--danger-ink); border:1px solid #F1C3B9;}
.btn-block{width:100%;}
.btn-sm{padding:9px 13px; font-size:.78rem; border-radius:10px;}
.btn-icon{width:44px; height:44px; padding:0; border-radius:50%;}

.progress-track{height:9px; border-radius:999px; background:var(--surface-3); overflow:hidden; border:1px solid var(--border-soft);}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--accent-dim),var(--accent)); border-radius:999px; transition:width .35s ease;}
.progress-fill.teal{background:linear-gradient(90deg,#3E8DB8,var(--sky));}
.progress-fill.success{background:linear-gradient(90deg,#3F8C56,var(--success));}
.progress-fill.danger{background:linear-gradient(90deg,#B8412F,var(--danger));}

.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:.68rem; font-weight:700; letter-spacing:.3px;}
.pill-low{background:var(--success-soft); color:#2F6B40;}
.pill-mid{background:var(--accent-soft); color:var(--accent-dim);}
.pill-high{background:var(--danger-soft); color:var(--danger-ink);}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.stat-tile{background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:12px; display:flex; flex-direction:column; gap:4px;}
.stat-tile .v{font-family:var(--font-mono); font-size:1.3rem; font-weight:600; font-variant-numeric:tabular-nums;}
.stat-tile .l{font-size:.68rem; color:var(--text-faint); letter-spacing:.2px;}

label.field{display:flex; flex-direction:column; gap:6px; font-size:.78rem; color:var(--text-dim); font-weight:600;}
input[type=text],input[type=number],input[type=date],textarea,select{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px;
  padding:11px 12px; font-size:.9rem; font-family:var(--font-body); width:100%;
}
input[type=range]{width:100%; accent-color:var(--accent);}
textarea{resize:vertical; min-height:60px;}
.check-wrap{display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none;}
.checkbox{
  width:22px; height:22px; border-radius:7px; border:2px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff;
}
.checkbox.checked{background:var(--accent); border-color:var(--accent);}

.divider{height:1px; background:var(--border-soft); margin:2px 0;}
.list-plain{display:flex; flex-direction:column; gap:8px;}
.badge-cat{font-size:.65rem; text-transform:uppercase; letter-spacing:.5px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--surface-3); color:var(--text-dim);}
.tag-row{display:flex; flex-wrap:wrap; gap:6px;}

a.linklike{color:var(--sky); text-decoration:none; font-weight:700; font-size:.85rem;}
.warn-box{background:var(--danger-soft); border:1px solid #F1C3B9; border-radius:var(--radius-md); padding:12px 14px; font-size:.78rem; line-height:1.5; color:var(--danger-ink); display:flex; gap:9px;}
.warn-box b{color:var(--text);}
.info-box{background:var(--sky-soft); border:1px solid #C3E2F2; border-radius:var(--radius-md); padding:12px 14px; font-size:.78rem; line-height:1.5; color:var(--sky-ink);}
.info-box b{color:var(--text);}
.info-box.lilac{background:var(--lilac-soft); border-color:#DAD0F5; color:var(--lilac-ink);}
.info-box.lilac b{color:var(--text);}

.chiprow{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch;}
.chip{flex-shrink:0; padding:8px 14px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); font-size:.78rem; font-weight:700; cursor:pointer;}
.chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}

/* ============ EXERCISE ANIMATION (articulated pictogram rig, per-exercise pose) ============ */
.exanim{width:100%; height:190px; flex:0 0 190px; max-width:100%; background:radial-gradient(ellipse at 50% 35%, var(--surface-3), var(--surface-2)); border:1px solid var(--border-soft); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; overflow:hidden;}
.exanim svg{width:82%; height:82%; filter:drop-shadow(0 3px 8px rgba(140,70,110,.18));}
.fx-rig g{transform-box:view-box;}
.fx-limb{stroke:var(--accent); stroke-width:6; stroke-linecap:round;}
.fx-spine{stroke:var(--accent); stroke-width:6.5; stroke-linecap:round;}
.fx-head{fill:var(--accent);}
.fx-joint{fill:var(--surface-2); stroke:var(--accent-dim); stroke-width:2;}
.fx-joint.fx-hand,.fx-joint.fx-foot{fill:var(--accent-dim); stroke:none;}
.fx-shadow{fill:rgba(140,70,110,.14);}
.fx-floor{stroke:var(--border); stroke-width:3; stroke-linecap:round;}
/* pivots — stand rig */
.fx-legL,.fx-legR,.fx-torso{transform-origin:60px 58px;}
.fx-shinL{transform-origin:51px 78px;}
.fx-shinR{transform-origin:69px 78px;}
.fx-armL,.fx-armR{transform-origin:60px 34px;}
.fx-forearmL{transform-origin:46px 46px;}
.fx-forearmR{transform-origin:74px 46px;}
/* pivots — ground rig */
.fx-torsoG,.fx-armG{transform-origin:30px 50px;}
.fx-forearmG{transform-origin:32px 70px;}
.fx-legG{transform-origin:62px 55px;}
.fx-shinG{transform-origin:85px 59px;}

@keyframes kfHipBobDeep{0%,100%{transform:translateY(0);}50%{transform:translateY(11px);}}
@keyframes kfHipBobSmall{0%,100%{transform:translateY(0);}50%{transform:translateY(5px);}}
@keyframes kfHeelLift{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes kfLegLBend{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-12deg);}}
@keyframes kfLegRBend{0%,100%{transform:rotate(0deg);}50%{transform:rotate(12deg);}}
@keyframes kfShinLBend{0%,100%{transform:rotate(0deg);}50%{transform:rotate(22deg);}}
@keyframes kfShinRBend{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-22deg);}}
@keyframes kfArmFwdL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-46deg);}}
@keyframes kfArmFwdR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(46deg);}}
@keyframes kfCurl{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-95deg);}}
@keyframes kfRowL{0%,100%{transform:rotate(20deg);}50%{transform:rotate(-38deg);}}
@keyframes kfRowR{0%,100%{transform:rotate(-20deg);}50%{transform:rotate(38deg);}}
@keyframes kfPallofL{0%,100%{transform:rotate(70deg);}50%{transform:rotate(20deg);}}
@keyframes kfPallofR{0%,100%{transform:rotate(-70deg);}50%{transform:rotate(-20deg);}}
@keyframes kfPressPulseL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(14deg);}}
@keyframes kfPressPulseR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-14deg);}}
@keyframes kfMicro{0%,100%{transform:translateX(0);}50%{transform:translateX(-1.5px);}}
@keyframes kfTwist{0%,100%{transform:rotate(-11deg);}50%{transform:rotate(11deg);}}
@keyframes kfKickback{0%,100%{transform:rotate(0deg);}50%{transform:rotate(38deg);}}
@keyframes kfLeanSlight{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-4deg);}}
@keyframes kfMarchLegUp{0%,60%,100%{transform:rotate(0deg);}30%{transform:rotate(-44deg);}}
@keyframes kfMarchShinUp{0%,60%,100%{transform:rotate(0deg);}30%{transform:rotate(58deg);}}
@keyframes kfMarchArm{0%,60%,100%{transform:rotate(0deg);}30%{transform:rotate(48deg);}}
@keyframes kfCircleL{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
@keyframes kfCircleR{0%{transform:rotate(0deg);}100%{transform:rotate(-360deg);}}
@keyframes kfSway{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}
@keyframes kfSwayArmL{0%,100%{transform:rotate(6deg);}50%{transform:rotate(-4deg);}}
@keyframes kfSwayArmR{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(4deg);}}
@keyframes kfPlankHold{0%,100%{transform:rotate(0deg);}50%{transform:rotate(1.2deg);}}
@keyframes kfPushArm{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-14deg);}}
@keyframes kfPushForearm{0%,100%{transform:rotate(0deg);}50%{transform:rotate(24deg);}}
@keyframes kfPushTorso{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-3deg);}}
@keyframes kfSupermanArm{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-16deg);}}
@keyframes kfSupermanLeg{0%,100%{transform:rotate(0deg);}50%{transform:rotate(10deg);}}
@keyframes kfClimberThigh{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-52deg);}}
@keyframes kfClimberShin{0%,100%{transform:rotate(0deg);}50%{transform:rotate(66deg);}}
@keyframes kfLegRaise{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-46deg);}}
@keyframes kfBridge{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-9deg);}}
@keyframes kfCatCow{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(6deg);}}

.anim-squat .fx-hipmove{animation:kfHipBobDeep 1.8s ease-in-out infinite;}
.anim-squat .fx-legL{animation:kfLegLBend 1.8s ease-in-out infinite;}
.anim-squat .fx-legR{animation:kfLegRBend 1.8s ease-in-out infinite;}
.anim-squat .fx-shinL{animation:kfShinLBend 1.8s ease-in-out infinite;}
.anim-squat .fx-shinR{animation:kfShinRBend 1.8s ease-in-out infinite;}
.anim-squat .fx-armL{animation:kfArmFwdL 1.8s ease-in-out infinite;}
.anim-squat .fx-armR{animation:kfArmFwdR 1.8s ease-in-out infinite;}
.anim-lunge .fx-legL{transform:rotate(24deg);}
.anim-lunge .fx-shinL{transform:rotate(-18deg);}
.anim-lunge .fx-legR{transform:rotate(-20deg);}
.anim-lunge .fx-shinR{transform:rotate(14deg);}
.anim-lunge .fx-hipmove{animation:kfHipBobSmall 1.8s ease-in-out infinite;}
.anim-calfraise .fx-hipmove{animation:kfHeelLift 1.4s ease-in-out infinite;}
.anim-dip .fx-armL{transform:rotate(150deg);}
.anim-dip .fx-armR{transform:rotate(-150deg);}
.anim-dip .fx-hipmove{animation:kfHipBobSmall 1.7s ease-in-out infinite;}
.anim-curl .fx-forearmR{animation:kfCurl 1.5s ease-in-out infinite;}
.anim-row .fx-armL{animation:kfRowL 1.4s ease-in-out infinite;}
.anim-row .fx-armR{animation:kfRowR 1.4s ease-in-out infinite;}
.anim-pallof .fx-armL{animation:kfPallofL 1.5s ease-in-out infinite;}
.anim-pallof .fx-armR{animation:kfPallofR 1.5s ease-in-out infinite;}
.anim-isopress .fx-forearmL{animation:kfPressPulseL 1s ease-in-out infinite;}
.anim-isopress .fx-forearmR{animation:kfPressPulseR 1s ease-in-out infinite;}
.anim-isopress .fx-armL{transform:rotate(58deg);}
.anim-isopress .fx-armR{transform:rotate(-58deg);}
.anim-scapula .fx-torso{animation:kfMicro 1.6s ease-in-out infinite;}
.anim-scapula .fx-armL{transform:rotate(70deg);}
.anim-scapula .fx-armR{transform:rotate(-70deg);}
.anim-twist .fx-torso{animation:kfTwist 1.6s ease-in-out infinite;}
.anim-kickback .fx-legR{animation:kfKickback 1.5s ease-in-out infinite;}
.anim-kickback .fx-torso{animation:kfLeanSlight 1.5s ease-in-out infinite;}
.anim-march .fx-legL{animation:kfMarchLegUp 1.1s ease-in-out infinite;}
.anim-march .fx-shinL{animation:kfMarchShinUp 1.1s ease-in-out infinite;}
.anim-march .fx-armR{animation:kfMarchArm 1.1s ease-in-out infinite;}
.anim-march .fx-legR{animation:kfMarchLegUp 1.1s ease-in-out infinite; animation-delay:-.55s;}
.anim-march .fx-shinR{animation:kfMarchShinUp 1.1s ease-in-out infinite; animation-delay:-.55s;}
.anim-march .fx-armL{animation:kfMarchArm 1.1s ease-in-out infinite; animation-delay:-.55s;}
.anim-shouldercircle .fx-armL{animation:kfCircleL 2s linear infinite;}
.anim-shouldercircle .fx-armR{animation:kfCircleR 2s linear infinite;}
.anim-stretch .fx-torso{animation:kfSway 2.4s ease-in-out infinite;}
.anim-stretch .fx-armL{animation:kfSwayArmL 2.4s ease-in-out infinite;}
.anim-stretch .fx-armR{animation:kfSwayArmR 2.4s ease-in-out infinite;}
.anim-plank .fx-torsoG{animation:kfPlankHold 2.2s ease-in-out infinite;}
.anim-pushup .fx-armG{animation:kfPushArm 1.6s ease-in-out infinite;}
.anim-pushup .fx-forearmG{animation:kfPushForearm 1.6s ease-in-out infinite;}
.anim-pushup .fx-torsoG{animation:kfPushTorso 1.6s ease-in-out infinite;}
.anim-superman .fx-armG{animation:kfSupermanArm 1.8s ease-in-out infinite;}
.anim-superman .fx-legG{animation:kfSupermanLeg 1.8s ease-in-out infinite;}
.anim-climber .fx-legG{animation:kfClimberThigh 1s ease-in-out infinite;}
.anim-climber .fx-shinG{animation:kfClimberShin 1s ease-in-out infinite;}
.anim-legraise .fx-legG{animation:kfLegRaise 1.7s ease-in-out infinite;}
.anim-bridge .fx-torsoG{animation:kfBridge 1.7s ease-in-out infinite;}
.anim-catcow .fx-legG{transform:rotate(48deg);}
.anim-catcow .fx-shinG{transform:rotate(-70deg);}
.anim-catcow .fx-armG{transform:rotate(6deg);}
.anim-catcow .fx-torsoG{animation:kfCatCow 2.4s ease-in-out infinite;}

/* ============ TRAINING (fullscreen focus mode) ============ */
#trainmode{position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; flex-direction:column; max-width:480px; margin:0 auto;}
.tm-top{display:flex; align-items:center; justify-content:space-between; padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px;}
.tm-close{background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); width:38px; height:38px; border-radius:50%; font-size:1rem; cursor:pointer;}
.tm-phase{font-size:.72rem; letter-spacing:1.5px; text-transform:uppercase; font-weight:700; color:var(--text-faint);}
.tm-body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:8px 22px 10px; text-align:center; overflow-y:auto;}
.tm-exname{font-size:1.5rem; font-family:var(--font-display); font-weight:700;}
.tm-timer{font-family:var(--font-mono); font-size:2.5rem; font-weight:600; font-variant-numeric:tabular-nums; line-height:1; letter-spacing:0; white-space:nowrap;}
.tm-timer.work{color:var(--accent-dim);}
.tm-timer.rest{color:var(--sky);}
.tm-sub{font-size:.95rem; color:var(--text-dim); font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.ring-wrap{position:relative; width:220px; height:220px; display:flex; align-items:center; justify-content:center;}
.ring-wrap svg{position:absolute; inset:0; transform:rotate(-90deg);}
.ring-bg{stroke:var(--surface-3); fill:none; stroke-width:9;}
.ring-fg{stroke:var(--accent); fill:none; stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset 1s linear;}
.ring-fg.rest{stroke:var(--sky);}
.reps-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; width:100%; max-width:280px;}
.rep-dot{aspect-ratio:1; border-radius:9px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:.8rem; color:var(--text-faint); cursor:pointer;}
.rep-dot.done{background:var(--accent); color:#fff; border-color:var(--accent);}
.tm-actions{display:flex; gap:10px; padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));}
.tm-actions .btn{flex:1;}
.tm-actions-row2{display:flex; gap:10px; padding:0 18px 10px;}
.tm-actions-row2 .btn{flex:1;}
.tm-nextprev{font-size:.78rem; color:var(--text-faint);}

.pain-overlay,.rating-overlay,.confirm-overlay{position:fixed; inset:0; background:rgba(80,50,70,.35); z-index:200; display:flex; align-items:flex-end; justify-content:center;}
.sheet{background:var(--surface); border-radius:22px 22px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px)); width:100%; max-width:480px; display:flex; flex-direction:column; gap:14px; border:1px solid var(--border-soft); border-bottom:none; box-shadow:var(--shadow);}
.zone-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.zone-btn{padding:12px 6px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); font-size:.8rem; font-weight:700; cursor:pointer;}
.zone-btn.sel{background:var(--danger-soft); border-color:var(--danger); color:var(--danger-ink);}
.feel-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.feel-btn{display:flex; flex-direction:column; align-items:center; gap:5px; padding:12px 4px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); font-size:.68rem; font-weight:700; cursor:pointer;}
.feel-btn.sel{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dim);}
.feel-btn .em{font-size:1.5rem;}

.toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--text); color:#fff; border:1px solid var(--text); padding:11px 18px; border-radius:999px; font-size:.82rem; font-weight:700; z-index:300; box-shadow:var(--shadow); display:flex; align-items:center; gap:8px;}

/* recipe modal */
.modal-overlay{position:fixed; inset:0; background:rgba(80,50,70,.35); z-index:150; display:flex; align-items:center; justify-content:center; padding:18px;}
.modal-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg); max-width:440px; width:100%; max-height:85vh; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow);}
.modal-close{align-self:flex-end; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:1rem;}
.ing-line{display:flex; justify-content:space-between; font-size:.85rem; padding:6px 0; border-bottom:1px dashed var(--border-soft);}
.step-line{display:flex; gap:10px; font-size:.85rem; line-height:1.5;}
.step-num{font-family:var(--font-mono); color:var(--accent-dim); font-weight:700; flex-shrink:0;}
.nutri-row{display:flex; gap:8px; flex-wrap:wrap;}
.nutri-chip{background:var(--surface-2); border:1px solid var(--border-soft); border-radius:9px; padding:7px 10px; font-size:.72rem; text-align:center; flex:1; min-width:64px;}
.nutri-chip b{display:block; font-family:var(--font-mono); font-size:.95rem;}

canvas#weightchart{width:100%; height:170px; display:block;}

@media (min-width:520px){
  body{background:var(--bg-alt);}
  #app-shell{margin-top:0; min-height:100vh;}
}

function ingCategory(name){
  const n=name.toLowerCase();
  if(n.includes('leche de coco')) return '🥑 Grasas';
  const lac=['leche','queso','yogur']; if(lac.some(k=>n.includes(k))) return '🥛 Lácteos';
  const prot=['pollo','pechuga','huevo','claras','carne','pescado','atún','tilapia','proteína en polvo'];
  if(prot.some(k=>n.includes(k))) return '🥩 Proteínas';
  const verd=['tomate','cebolla','zanahoria','espinaca','lechuga','pepino','pimentón','brócoli','apio','calabacín','champiñ','cilantro'];
  if(verd.some(k=>n.includes(k))) return '🥦 Verduras';
  const frut=['banano','mora','fresa','manzana','guayaba','limón']; if(frut.some(k=>n.includes(k))) return '🍎 Frutas';
  const cer=['arroz','avena','pan','arepa','tortilla','quinoa','granola','mazorca']; if(cer.some(k=>n.includes(k))) return '🌾 Cereales';
  const tub=['yuca','ahuyama','calabaza']; if(tub.some(k=>n.includes(k))) return '🥔 Tubérculos';
  const gra=['aguacate','aceite','maní','almendra','nuez','nueces','ajo','chía','semillas']; if(gra.some(k=>n.includes(k))) return '🥑 Grasas';
  return '🧂 Otros';
}

function loadState(){
 try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const parsed=JSON.parse(raw); return Object.assign(defaultState(),parsed,{
   profile:Object.assign(defaultState().profile,parsed.profile||{}, {restrictions:Object.assign({back:true,note:''},(parsed.profile&&parsed.profile.restrictions)||{})})
 }); } }catch(e){}
 return defaultState();
}
let state = loadState();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

function currentWeight(s){ if(s.logs && s.logs.length){ return [...s.logs].sort((a,b)=>a.date<b.date?1:-1)[0].weight; } return s.profile.currentWeight; }
function kgLost(s){ return Math.max(0, s.profile.initialWeight - currentWeight(s)); }
function kgLeft(s){ return Math.max(0, currentWeight(s) - s.profile.goalWeight); }
function progressPct(s){ const total=s.profile.initialWeight-s.profile.goalWeight; if(total<=0) return 100; return Math.max(0,Math.min(100, Math.round((kgLost(s)/total)*100))); }
function computeStreak(s){
 const days = new Set(s.trainingHistory.map(h=>h.date));
 let streak=0; let d=new Date();
 for(;;){ const key=d.toISOString().slice(0,10); if(days.has(key)){ streak++; d.setDate(d.getDate()-1);} else break; }
 return streak;
}
function todayKey(){ return new Date().toISOString().slice(0,10); }

let sess=null; let sessTimer=null; let audioCtx=null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume(); } }
function beep(freq,dur,type){
 if(!audioCtx) return;
 try{
  const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.18,audioCtx.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur+0.02);
 }catch(e){}
}
let musicPulseTimer=null;
function startMusicPulse(){
 stopMusicPulse();
 if(state.music==='silencio'||!audioCtx) return;
 const bpm = {motivacional:126, energico:138, cardio:132, concentracion:96}[state.music]||120;
 const interval = 60000/bpm;
 musicPulseTimer = setInterval(()=>{ beep(state.music==='energico'?820:70+0*0, 0.05, 'triangle'); }, interval);
}
function stopMusicPulse(){ if(musicPulseTimer){ clearInterval(musicPulseTimer); musicPulseTimer=null; } }

/* ---- Música propia por bloque (archivos locales del usuario, guardados en IndexedDB) ---- */
const AUDIO_KEYS = [
 {key:'warmup', label:'Calentamiento', icon:'🔸'},
 {key:'work', label:'Bloque de fuerza / trabajo', icon:'💪'},
 {key:'corecardio', label:'Core y cardio', icon:'🌷'},
 {key:'rest', label:'Descansos', icon:'⏳'},
 {key:'cooldown', label:'Vuelta a la calma', icon:'🧘‍♀️'},
];
let audioCache={};
function idbOpen(){
 return new Promise((resolve,reject)=>{
  try{
   const req=indexedDB.open('lore_training_audio_v1',1);
   req.onupgradeneeded=()=>{ req.result.createObjectStore('tracks',{keyPath:'key'}); };
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error);
  }catch(e){ reject(e); }
 });
}
async function idbGetAll(){
 try{ const db=await idbOpen(); return await new Promise((resolve,reject)=>{
  const tx=db.transaction('tracks','readonly'); const req=tx.objectStore('tracks').getAll();
  req.onsuccess=()=>resolve(req.result||[]); req.onerror=()=>reject(req.error);
 }); }catch(e){ return []; }
}
async function idbPut(key,name,blob){
 try{ const db=await idbOpen(); await new Promise((resolve,reject)=>{
  const tx=db.transaction('tracks','readwrite'); tx.objectStore('tracks').put({key,name,blob});
  tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
 }); }catch(e){}
}
async function idbDelete(key){
 try{ const db=await idbOpen(); await new Promise((resolve,reject)=>{
  const tx=db.transaction('tracks','readwrite'); tx.objectStore('tracks').delete(key);
  tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
 }); }catch(e){}
}
async function loadAudioCache(){
 const rows=await idbGetAll();
 rows.forEach(r=>{ try{ audioCache[r.key]={name:r.name, url:URL.createObjectURL(r.blob)}; }catch(e){} });
}
function audioKeyFor(phase,mode){
 if(mode==='rest') return 'rest';
 if(phase==='warmup') return 'warmup';
 if(phase==='cooldown') return 'cooldown';
 if(phase==='core'||phase==='cardio') return 'corecardio';
 return 'work';
}
function playBlockAudio(key){
 const el=document.getElementById('bg-audio'); if(!el) return;
 const track=audioCache[key];
 if(track){
  stopMusicPulse();
  if(el.dataset.key!==key){ el.src=track.url; el.dataset.key=key; }
  el.play().catch(()=>{});
 } else {
  el.pause(); el.removeAttribute('src'); delete el.dataset.key;
  if(state.music!=='silencio'){ startMusicPulse(); }
 }
}
function pauseBlockAudio(){ const el=document.getElementById('bg-audio'); if(el && !el.paused) el.pause(); stopMusicPulse(); }
function resumeBlockAudio(){
 const el=document.getElementById('bg-audio');
 if(el && el.dataset.key){ el.play().catch(()=>{}); }
 else if(state.music!=='silencio'){ startMusicPulse(); }
}
function stopBlockAudio(){ const el=document.getElementById('bg-audio'); if(el){ el.pause(); el.removeAttribute('src'); delete el.dataset.key; } stopMusicPulse(); }

function buildSessionBlocks(){
 const s=state; const tIdx = s.dayCounter % TEMPLATES[s.stage].length;
 const tpl = TEMPLATES[s.stage][tIdx];
 const order=[...tpl.warm.map(id=>({id,phase:'warmup'})), ...tpl.main.map(id=>({id,phase:'main'})),
   ...((tpl.cardio||[]).map(id=>({id,phase:'cardio'}))), ...((tpl.core||[]).map(id=>({id,phase:'core'}))),
   ...tpl.cool.map(id=>({id,phase:'cooldown'}))];
 return order.map(o=>{
  const e=EXO_MAP[o.id]; const sets=setsForStage(e.sets,s.stage);
  return {exId:o.id, phase:o.phase, kind:e.kind, sets, reps:e.reps, seconds:e.seconds, doneReps:Array.from({length:sets},()=>0), feel:null};
 });
}
function startMission(){
 sess = { blocks: buildSessionBlocks(), bi:0, mode:'work', secondsLeft:0, setIdx:0, startedAt:Date.now(), paused:false, feels:[] };
 ensureAudio();
 const b0=sess.blocks[0];
 if(b0.kind==='time'){ sess.secondsLeft=b0.seconds; sess.mode='work'; }
 document.getElementById('trainmode').style.display='flex';
 renderTrain();
 playBlockAudio(audioKeyFor(b0.phase, sess.mode));
 tickTrainingClock();
}
function currentBlock(){ return sess.blocks[sess.bi]; }
function nextBlock(){
 stopSessTimer();
 sess.setIdx=0;
 sess.bi++;
 if(sess.bi>=sess.blocks.length){ finishMission(); return; }
 const b=currentBlock();
 sess.mode='work';
 if(b.kind==='time'){ sess.secondsLeft=b.seconds; }
 renderTrain();
 playBlockAudio(audioKeyFor(b.phase, sess.mode));
 tickTrainingClock();
}
function stopSessTimer(){ if(sessTimer){ clearInterval(sessTimer); sessTimer=null; } }
function tickTrainingClock(){
 stopSessTimer();
 const b=currentBlock(); if(!b || b.kind!=='time') return;
 beep(660,0.15,'sine');
 sessTimer=setInterval(()=>{
  if(sess.paused) return;
  sess.secondsLeft--;
  if(sess.secondsLeft===10 && sess.mode==='work'){ beep(880,0.1,'square'); }
  if(sess.secondsLeft<=0){
   if(sess.mode==='work'){
    beep(520,0.35,'sawtooth');
    sess.setIdx++;
    if(sess.setIdx<b.sets){ sess.mode='rest'; sess.secondsLeft=restForStage(state.stage); beep(300,0.1,'sine'); playBlockAudio(audioKeyFor(b.phase,'rest')); }
    else { beep(300,0.12,'sine'); nextBlock(); return; }
   } else {
    beep(660,0.2,'sine');
    sess.mode='work'; sess.secondsLeft=b.seconds;
    playBlockAudio(audioKeyFor(b.phase,'work'));
   }
  }
  renderTrainTimerOnly();
 },1000);
}
function toggleRep(setI,repI){
 const b=currentBlock(); const cur=b.doneReps[setI];
 if(repI < cur){ b.doneReps[setI]=repI; } else { b.doneReps[setI]=repI+1; }
 if(b.doneReps[setI]>=b.reps){
  beep(520,0.3,'sawtooth');
  if(setI+1<b.sets){ sess.setIdx=setI+1; toast('Serie '+(setI+1)+' completada ✅','✅'); }
  else { toast('🏆 Bloque completado'); setTimeout(()=>nextBlock(),350); }
 }

function drawWeightChart(){
 const cv=document.getElementById('weightchart'); if(!cv) return;
 const ctx=cv.getContext('2d');
 const dpr=window.devicePixelRatio||1;
 const rect=cv.getBoundingClientRect();
 cv.width=rect.width*dpr; cv.height=170*dpr;
 ctx.scale(dpr,dpr);
 const W=rect.width, H=170;
 ctx.clearRect(0,0,W,H);
 const s=state;
 const pts=[{date:'inicio',weight:s.profile.initialWeight}, ...[...s.logs].sort((a,b)=>a.date<b.date?-1:1).map(l=>({date:l.date,weight:l.weight}))];
 const allW = pts.map(p=>p.weight).concat([s.profile.goalWeight]);
 const maxW=Math.max(...allW)+2, minW=Math.min(...allW)-2;
 const padL=34,padR=10,padT=14,padB=20;
 const x=i=> padL + (pts.length<=1?0:(i/(pts.length-1))*(W-padL-padR));
 const y=w=> padT + (1-(w-minW)/(maxW-minW))*(H-padT-padB);
 const cs=getComputedStyle(document.documentElement);
 const gridColor=cs.getPropertyValue('--border-soft').trim()||'#eee';
 const textColor=cs.getPropertyValue('--text-faint').trim()||'#999';
 const accent=cs.getPropertyValue('--accent').trim()||'#E8547C';
 const sky=cs.getPropertyValue('--sky').trim()||'#4FA8D8';
 ctx.strokeStyle=gridColor; ctx.lineWidth=1; ctx.font='10px Roboto Mono, monospace'; ctx.fillStyle=textColor;
 for(let g=0; g<=3; g++){ const gw=minW+(g/3)*(maxW-minW); const gy=y(gw); ctx.beginPath(); ctx.moveTo(padL,gy); ctx.lineTo(W-padR,gy); ctx.stroke(); ctx.fillText(gw.toFixed(0), 2, gy+3); }
 // línea de meta
 const gy2=y(s.profile.goalWeight); ctx.strokeStyle=sky; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(padL,gy2); ctx.lineTo(W-padR,gy2); ctx.stroke(); ctx.setLineDash([]);
 ctx.fillStyle=sky; ctx.fillText('Meta '+s.profile.goalWeight+'kg', padL+4, gy2-4);
 // línea de progreso
 if(pts.length>1){
  ctx.strokeStyle=accent; ctx.lineWidth=2.5; ctx.beginPath();
  pts.forEach((p,i)=>{ const px=x(i),py=y(p.weight); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); });
  ctx.stroke();
 }
 pts.forEach((p,i)=>{ const px=x(i),py=y(p.weight); ctx.beginPath(); ctx.arc(px,py,3.2,0,7); ctx.fillStyle=accent; ctx.fill(); });
}

  <label class="field">Notas<textarea id="log-notes" placeholder="Observaciones del día...">${logDraft.notes}</textarea></label>
  <button class="btn btn-primary btn-block" id="btn-save-log">Guardar en vitácora</button>
 </div>

 <div class="card">
  <div class="eyebrow">Historial</div>
  <div class="list-plain">
   ${sortedLogs.length===0? `<div class="faint" style="font-size:.85rem;">Aún no hay registros.</div>` :
    sortedLogs.slice(0,14).map(l=>h`
    <div class="card tight">
     <div class="card-row"><span style="font-weight:600;font-size:.85rem;">${l.date}</span><span class="big-num" style="font-size:.95rem;">${l.weight} kg</span></div>
     <div class="faint" style="font-size:.72rem;">Cintura ${l.waist||'—'} cm · Sueño ${l.sleep}h · Energía ${l.energy}/10 · Dolor ${l.pain}/10 · ${l.trainingDone?'✅ entrenó':'— descanso'}</div>
     ${l.notes?`<div style="font-size:.78rem;" class="muted">"${esc(l.notes)}"</div>`:''}
    </div>`).join('')}
  </div>
 </div>

 <div class="card">
  <div class="eyebrow">🏅 Logros (${Object.keys(s.unlockedAch).length}/${ACHIEVEMENTS.length})</div>
  <div class="grid3">
   ${ACHIEVEMENTS.map(a=>{ const un=!!s.unlockedAch[a.id]; return `
    <div class="stat-tile" style="align-items:center;text-align:center;opacity:${un?1:.4};">
     <div style="font-size:1.5rem;">${a.icon}</div>
     <div class="l" style="text-align:center;">${a.label}${a.id==='goal'?' ('+s.profile.goalWeight+' kg)':''}</div>
    </div>`;}).join('')}
  </div>
 </div>
 `;
}
function checkAchievements(){
 let any=false;
 ACHIEVEMENTS.forEach(a=>{ if(!state.unlockedAch[a.id] && a.cond(state)){ state.unlockedAch[a.id]=todayKey(); any=true; toast(a.icon+' Logro desbloqueado: '+a.label, a.icon); } });
 if(any) save();
}

/* =====================================================================
   PANTALLA: PERFIL
   ===================================================================== */
let resetConfirmStep=0;
function screenProfile(){
 const s=state.profile;
 return h`
 <div class="card">
  <div class="eyebrow">Mi perfil</div>
  <label class="field">Nombre<input type="text" id="pf-name" value="${esc(s.name)}"></label>
  <div class="grid2">
   <label class="field">Edad<input type="number" id="pf-age" value="${s.age}"></label>

  </div>
  <div class="grid2">

   <label class="field">Peso objetivo (kg)<input type="number" step="0.1" id="pf-goalw" value="${s.goalWeight}"></label>
  </div>
  <div class="grid2">
   <label class="field">Disponibilidad diaria (min)<input type="number" id="pf-avail" value="${s.availability}"></label>
   <label class="field">Lugar de entrenamiento<input type="text" id="pf-place" value="${esc(s.place)}"></label>
  </div>
  <label class="field">Equipamiento disponible<input type="text" id="pf-equip" value="${esc(s.equipment)}"></label>
  <button class="btn btn-primary btn-block" id="btn-save-profile">Guardar cambios</button>
 </div>

 <div class="card" style="border-color:#F1C3B9;">
  <div class="eyebrow" style="color:var(--danger-ink);">⚠️ Consideraciones físicas</div>
  <div class="check-wrap" id="pf-back-wrap"><div class="checkbox ${s.restrictions.back?'checked':''}">${s.restrictions.back?'✓':''}</div><span style="font-size:.87rem;">Dolor / molestia de espalda</span></div>
  <div class="check-wrap" id="pf-insulin-wrap"><div class="checkbox ${s.insulinResistance?'checked':''}">${s.insulinResistance?'✓':''}</div><span style="font-size:.87rem;">Resistencia a la insulina (ajusta el enfoque nutricional)</span></div>
  <div class="check-wrap" id="pf-digestive-wrap"><div class="checkbox ${s.digestiveCare?'checked':''}">${s.digestiveCare?'✓':''}</div><span style="font-size:.87rem;">Hemorroides / indicios de colon irritable (sin granos, modera gatillantes)</span></div>
  <label class="field">Notas adicionales<textarea id="pf-restrict-note" placeholder="Otra condición a considerar...">${esc(s.restrictions.note||'')}</textarea></label>
  <div class="faint" style="font-size:.72rem;">Estas condiciones ajustan las advertencias y recomendaciones del motor de adaptación en cada ejercicio y en la sección de nutrición.</div>
  <button class="btn btn-ghost btn-block btn-sm" id="btn-save-restrictions">Guardar consideraciones</button>
 </div>

 <div class="warn-box">⚠️ <span><b>Aviso de seguridad:</b> Lore Training no sustituye valoración médica, fisioterapia ni nutricional. Antes de iniciar o aumentar la intensidad, confirma con tu médico/fisioterapeuta qué movimientos, rangos e impactos están autorizados para tu espalda, y sigue el acompañamiento de tu médico para la resistencia a la insulina. No diagnosticamos ni prescribimos tratamientos. Ante dolor agudo, inflamación, hormigueo, pérdida de fuerza, mareo, dolor torácico o dificultad respiratoria: detén la actividad y busca atención profesional.</span></div>

 <div class="card">
  <div class="eyebrow">🎵 Mi música por bloque</div>
  <div class="faint" style="font-size:.75rem; line-height:1.5;">Sube canciones que ya tengas guardadas en tu dispositivo (compradas, libres de regalías o tuyas). Se guardan solo en este navegador — nada se sube a internet. Asigna una por tipo de bloque y sonará en bucle automáticamente durante el entrenamiento.</div>
  <div class="list-plain">
   ${AUDIO_KEYS.map(a=>{ const t=audioCache[a.key]; return h`
   <div class="card tight">
    <div class="card-row">
     <span style="font-weight:600;font-size:.85rem;">${a.icon} ${a.label}</span>
     ${t?`<button class="btn btn-danger-outline btn-sm" data-audio-remove="${a.key}">Quitar</button>`:''}
    </div>
    <div class="faint" style="font-size:.72rem;">${t? '🎧 '+esc(t.name) : 'Sin canción asignada · sonará el ambiente generado'}</div>
    <label class="btn btn-ghost btn-sm btn-block" style="cursor:pointer;">
     ${t?'Reemplazar archivo':'Elegir archivo de audio'}
     <input type="file" accept="audio/*" data-audio-key="${a.key}" style="display:none;">
    </label>
   </div>`;}).join('')}
  </div>
 </div>

 <div class="card">
  <div class="eyebrow">🎚 Ambiente generado (respaldo)</div>
  <div class="faint" style="font-size:.72rem;">Se usa solo en los bloques sin canción propia asignada. Son pulsos guía generados con Web Audio API, sin música comercial protegida.</div>
  <div class="chiprow">${[['silencio','Silencio'],['motivacional','Motivacional'],['energico','Enérgico'],['cardio','Cardio'],['concentracion','Concentración']].map(([k,l])=>`<div class="chip ${state.music===k?'active':''}" data-music="${k}">${l}</div>`).join('')}</div>
 </div>

 <div class="card">
  <div class="eyebrow">Datos</div>
  <div class="faint" style="font-size:.78rem;">Todo se guarda únicamente en este dispositivo (almacenamiento local del navegador). Ninguna foto o dato se envía a servidores externos en esta versión.</div>
  ${resetConfirmStep===0?
   `<button class="btn btn-danger-outline btn-block" id="btn-reset1">Reiniciar progreso</button>` :
   `<div class="warn-box">¿Segura? Esto borrará perfil, entrenamientos, vitácora, mercado y logros de forma permanente.</div>
    <div class="grid2"><button class="btn btn-ghost" id="btn-reset-cancel">Cancelar</button><button class="btn btn-danger" id="btn-reset-confirm">Sí, reiniciar todo</button></div>`}
 </div>
 `;
}

/* =====================================================================
   ROUTER + INIT
   ===================================================================== */
const TAB_LABEL={home:'Inicio',train:'Entrenar',nutrition:'Nutrición',market:'Mercado',progress:'Progreso',profile:'Perfil'};
function setTab(t){
 tab=t;
 document.getElementById('tab-label').textContent=TAB_LABEL[t];
 document.getElementById('streak-chip').textContent='🔥 '+computeStreak(state);
 document.querySelectorAll('#bottomnav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
 if(t==='home') $screen.innerHTML=screenHome();
 else if(t==='train') $screen.innerHTML=screenTrain();
 else if(t==='nutrition') $screen.innerHTML=screenNutrition();
 else if(t==='market') $screen.innerHTML=screenMarket();
 else if(t==='progress'){ $screen.innerHTML=screenProgress(); requestAnimationFrame(drawWeightChart); }
 else if(t==='profile') $screen.innerHTML=screenProfile();
 window.scrollTo(0,0);
}

document.getElementById('bottomnav').addEventListener('click', e=>{
 const btn=e.target.closest('button[data-tab]'); if(btn) setTab(btn.dataset.tab);
});

document.addEventListener('click', e=>{
 // Home
 if(e.target.closest('#btn-start-mission') || e.target.closest('#btn-start-mission2')){ startMission(); return; }
 if(e.target.closest('#btn-advance-stage')){ if(state.stage<4){ state.stage++; save(); toast('🌸 Avanzaste a Etapa '+state.stage); setTab('train'); } return; }
 // Train library
 const catChip=e.target.closest('.chip[data-cat]'); if(catChip){ libFilter=catChip.dataset.cat; setTab('train'); return; }
 const exCard=e.target.closest('[data-ex]'); if(exCard){ $overlay.innerHTML=screenExerciseDetail(exCard.dataset.ex); return; }
 if(e.target.closest('#close-exercise')){ $overlay.innerHTML=''; return; }
 if(e.target.closest('#ov-exercise') && e.target.id==='ov-exercise'){ $overlay.innerHTML=''; return; }
 // Nutrition
 const nutriChip=e.target.closest('.chip[data-nutriday]'); if(nutriChip){ nutriDay=parseInt(nutriChip.dataset.nutriday); setTab('nutrition'); return; }
 const recipeBtn=e.target.closest('[data-recipe]'); if(recipeBtn){ $overlay.innerHTML=screenRecipeModal(recipeBtn.dataset.recipe); return; }
 if(e.target.closest('#close-recipe')){ $overlay.innerHTML=''; return; }
 if(e.target.closest('#ov-recipe') && e.target.id==='ov-recipe'){ $overlay.innerHTML=''; return; }
 const cycleBtn=e.target.closest('[data-cycle]'); if(cycleBtn){ const [slot,cat]=cycleBtn.dataset.cycle.split('|'); cycleMeal(nutriDay,slot,cat); return; }
 // Market
 if(e.target.closest('#btn-regen-market')){ renderMarketAuto(); setTab('market'); toast('Lista actualizada'); return; }
 const buyToggle=e.target.closest('[data-toggle-buy]'); if(buyToggle){ const n=buyToggle.dataset.toggleBuy; state.market[n].purchased=!state.market[n].purchased; save(); setTab('market'); return; }
 // Progress
 if(e.target.closest('#log-trained-wrap')){ logDraft.trainingDone=!logDraft.trainingDone; setTab('progress'); return; }
 if(e.target.closest('#btn-save-log')){ submitLog(); return; }
 // Profile
 if(e.target.closest('#btn-save-profile')){
  const p=state.profile;
  p.name=document.getElementById('pf-name').value||p.name;
  p.age=parseInt(document.getElementById('pf-age').value)||p.age;
  p.height=parseFloat(document.getElementById('pf-height').value)||p.height;
  p.initialWeight=parseFloat(document.getElementById('pf-initw').value)||p.initialWeight;
  p.goalWeight=parseFloat(document.getElementById('pf-goalw').value)||p.goalWeight;
  p.availability=parseInt(document.getElementById('pf-avail').value)||p.availability;
  p.place=document.getElementById('pf-place').value||p.place;
  p.equipment=document.getElementById('pf-equip').value||p.equipment;
  save(); toast('Perfil actualizado ✔️'); setTab('profile'); return;
 }
 if(e.target.closest('#pf-back-wrap')){ state.profile.restrictions.back=!state.profile.restrictions.back; setTab('profile'); return; }
 if(e.target.closest('#pf-insulin-wrap')){ state.profile.insulinResistance=!state.profile.insulinResistance; setTab('profile'); return; }
 if(e.target.closest('#pf-digestive-wrap')){ state.profile.digestiveCare=!state.profile.digestiveCare; setTab('profile'); return; }
 if(e.target.closest('#btn-save-restrictions')){ state.profile.restrictions.note=document.getElementById('pf-restrict-note').value; save(); toast('Consideraciones guardadas'); setTab('profile'); return; }
 const musicChip=e.target.closest('.chip[data-music]'); if(musicChip){ state.music=musicChip.dataset.music; save(); setTab('profile'); return; }
 const audioRm=e.target.closest('[data-audio-remove]'); if(audioRm){
  const key=audioRm.dataset.audioRemove;
  idbDelete(key).then(()=>{ if(audioCache[key]){ URL.revokeObjectURL(audioCache[key].url); delete audioCache[key]; } toast('Canción eliminada'); setTab('profile'); });
  return;
 }
 if(e.target.closest('#btn-reset1')){ resetConfirmStep=1; setTab('profile'); return; }
 if(e.target.closest('#btn-reset-cancel')){ resetConfirmStep=0; setTab('profile'); return; }
 if(e.target.closest('#btn-reset-confirm')){
  try{ localStorage.removeItem(STORE_KEY); }catch(err){}
  state=defaultState(); resetConfirmStep=0; logDraft=null; setTab('home'); toast('Progreso reiniciado');
  return;
 }
});
document.addEventListener('input', e=>{
 if(e.target.id==='pain-range') return; // manejado en línea
 if(e.target.id==='log-energy'){ logDraft.energy=parseInt(e.target.value); document.getElementById('log-energy-val').textContent=logDraft.energy; }
 if(e.target.id==='log-pain'){ logDraft.pain=parseInt(e.target.value); document.getElementById('log-pain-val').textContent=logDraft.pain; }
 if(e.target.id==='log-date') logDraft.date=e.target.value;
 if(e.target.id==='log-weight') logDraft.weight=parseFloat(e.target.value)||0;
 if(e.target.id==='log-waist') logDraft.waist=e.target.value;
 if(e.target.id==='log-sleep') logDraft.sleep=parseFloat(e.target.value)||0;
 if(e.target.id==='log-notes') logDraft.notes=e.target.value;
 const priceInput=e.target.closest('[data-price]'); if(priceInput){ const n=priceInput.dataset.price; state.market[n].price=priceInput.value; save(); setTab('market'); }
});
document.addEventListener('change', e=>{
 const fileInput=e.target.closest('input[type=file][data-audio-key]');
 if(fileInput && fileInput.files && fileInput.files[0]){
  const key=fileInput.dataset.audioKey; const file=fileInput.files[0];
  idbPut(key,file.name,file).then(()=>{
   if(audioCache[key]) URL.revokeObjectURL(audioCache[key].url);
   audioCache[key]={name:file.name, url:URL.createObjectURL(file)};
   toast('🎵 Asignada: '+file.name);
   setTab('profile');
  });
 }
});

function boot(hotData){
 if(hotData && typeof hotData==='object' && Object.keys(hotData).length){
  try{ state=Object.assign(defaultState(), hotData, {profile:Object.assign(defaultState().profile, hotData.profile||{}, {restrictions:Object.assign({back:true,note:''},(hotData.profile&&hotData.profile.restrictions)||{})})}); }catch(e){}
 }
 renderMarketAuto();
 setTab('home');
 loadAudioCache().then(()=>{ if(tab==='profile') setTab('profile'); });
}
window.claude?.hot?.snapshot && window.claude.hot.snapshot(()=>state);
if(window.claude?.hot?.ready){ window.claude.hot.ready(boot); } else { boot(null); }
</script>

<script>
// Registro del service worker: habilita instalación como app y uso básico sin conexión.
// Solo funciona cuando el archivo se sirve por http/https (ej. GitHub Pages) — los navegadores
// no permiten service workers al abrir el HTML directo como archivo local (file:// o content://).
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
